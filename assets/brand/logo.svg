<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- feltro da mesa -->
  <rect width="1024" height="1024" rx="232" fill="#123b2f"/>
  <rect x="40" y="40" width="944" height="944" rx="196" fill="none" stroke="#1c4d3e" stroke-width="16"/>
  <!-- quatro risquinhos de giz, levemente tortos como feitos à mão -->
  <g stroke="#f4efe4" stroke-width="68" stroke-linecap="round">
    <line x1="318" y1="300" x2="306" y2="724"/>
    <line x1="430" y1="292" x2="436" y2="730"/>
    <line x1="548" y1="302" x2="540" y2="722"/>
    <line x1="662" y1="294" x2="672" y2="728"/>
  </g>
  <!-- o quinto risco fecha a contagem -->
  <line x1="214" y1="652" x2="790" y2="372" stroke="#f2b632" stroke-width="72" stroke-linecap="round"/>
</svg>
